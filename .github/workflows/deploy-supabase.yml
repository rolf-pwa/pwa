name: Deploy to Supabase

# After a merge to main: apply the new migrations to production, then deploy the edge functions that changed. Runs one at a time, never cancelled midway.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard > Account > Access Tokens).
# Manual run: Actions > Deploy to Supabase > Run workflow, with function names and/or migration files to redo (recovery).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/ci-deploy.sh"
      - "scripts/ci-changed-functions.py"
  workflow_dispatch:
    inputs:
      functions:
        description: "Edge functions to redeploy, space separated (optional)"
        required: false
      migrations:
        description: "Migration files to apply, space separated, e.g. supabase/migrations/2026..._x.sql (optional)"
        required: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."; exit 1
          fi
      - name: Apply migrations and deploy functions
        env:
          FUNCTIONS: ${{ github.event.inputs.functions }}
          MIGRATIONS: ${{ github.event.inputs.migrations }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/ci-deploy.sh
          else
            scripts/ci-deploy.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi
