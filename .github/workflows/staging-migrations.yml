name: Staging migration test

# Rebuilds the staging project from scratch with this pull request's migrations (main's plus the new ones), then runs the open-policy audit against it.
# It catches: a migration that fails on a fresh database, one that depends on something only production has, and one that opens a table to everyone.
# The job runs on every pull request so it can be a required check; it does nothing unless the pull request touches supabase/migrations, scripts/staging or this file.
# Staging holds no client data and is wiped by every run; runs queue one at a time. Needs the repository secret SUPABASE_STAGING_ACCESS_TOKEN: a Supabase access token limited to the staging project, so a pull request can never reach production from here.
on:
  pull_request:

concurrency:
  group: staging-migrations
  cancel-in-progress: false

jobs:
  staging-migrations:
    runs-on: ubuntu-latest
    # Pull requests from forks never get secrets, so only same-repository branches run this.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
    steps:
      - name: Check the staging token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_STAGING_ACCESS_TOKEN is not set (Settings > Secrets and variables > Actions)."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this pull request change migrations (or this test itself)?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(supabase/migrations/|scripts/staging/|\.github/workflows/staging-migrations\.yml)'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration changes; nothing to test."
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.migrations == 'true'
        with:
          node-version: 20
      - name: Rebuild staging from the migrations
        if: steps.changed.outputs.migrations == 'true'
        run: RESET=1 scripts/staging/build.sh
      - name: Open-policy audit on the rebuilt staging database
        if: steps.changed.outputs.migrations == 'true'
        run: scripts/staging/audit.sh
