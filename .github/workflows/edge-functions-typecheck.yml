name: Edge function type check

# Runs on every pull request (no path filter) so it can be a required check: a required check that never reports blocks the merge.
# The script exits at once with "No edge functions changed" when a pull request does not touch supabase/functions.
on:
  pull_request:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # tsc and vite never read supabase/functions, so this is the only type check these files get.
      - name: deno check the functions this pull request changes
        run: scripts/deno-check-functions.sh "origin/${{ github.base_ref }}"
